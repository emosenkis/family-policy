name: Rust CI and Releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test and build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            suffix: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: '.exe'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify Unix service lifecycle
        if: runner.os != 'Windows'
        run: sudo bash .github/scripts/test-service.sh "$PWD/target/${{ matrix.target }}/release/family-policy"
      - name: Verify Windows service lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-service.ps1 -Binary "$PWD/target/${{ matrix.target }}/release/family-policy.exe"
      - name: Name release binary
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/family-policy${{ matrix.suffix }} artifacts/family-policy-${{ matrix.target }}${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: family-policy-${{ matrix.target }}
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum family-policy-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Family Policy $GITHUB_REF_NAME" --generate-notes ./*

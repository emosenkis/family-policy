[package]
name = "family-policy"
version = "0.2.0"
edition = "2024"
description = "Browser Extension Policy Manager - Manages browser policies and privacy controls"
homepage = "https://github.com/emosenkis/family-policy"
license = "MIT OR Apache-2.0"
authors = ["Family Policy Team"]

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.50", features = ["derive"] }
directories = "6.0.0"
libc = "0.2.177"
rand = "0.8.5"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.8"
winreg = "0.55.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"]  }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.8.0"

[dev-dependencies]
assert_fs = "1.1.3"
plist = "1.8.0"
predicates = "3.1.3"
tempfile = "3.23.0"

